<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>DPSH Campo</title>
<style>
:root{--bg:#e9eff7;--surf:#fff;--ink:#0f1c2e;--mut:#5b6b82;--pri:#0b3d91;--pri2:#1565c0;--ok:#0e8a4a;--warn:#e69100;--bad:#c62828;--line:#cdd8e6;--sh:0 1px 3px rgba(15,28,46,.08),0 6px 18px rgba(15,28,46,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:18px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer}
#app{height:100dvh;max-width:640px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd{flex:none;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 14px 18px;color:#fff;background:linear-gradient(135deg,#0b3d91,#1565c0);border-radius:0 0 26px 26px;box-shadow:0 5px 16px rgba(11,61,145,.35);z-index:2}
.hd .t{flex:1;min-width:0}
.hd h1{margin:0;font-size:23px;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sub{font-size:15px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sub b{font-size:20px;font-variant-numeric:tabular-nums}
.hb{flex:none;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.17);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative}
.hb:active{background:rgba(255,255,255,.3)}
.hb .dot{position:absolute;right:7px;top:7px;width:11px;height:11px;border-radius:50%;background:#9db0cc;border:2px solid #0b3d91}.hb .dot.on{background:#35d07f}
.hb.end{width:auto;border-radius:24px;padding:0 16px;gap:8px;background:#fff;color:var(--bad);font-weight:800;font-size:17px}
.logo{width:46px;height:46px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.pg{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 18px;-webkit-overflow-scrolling:touch}
.dock{flex:none;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--surf);box-shadow:0 -4px 16px rgba(15,28,46,.12);display:flex;flex-direction:column;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:10px 18px;border-radius:16px;background:var(--pri);color:#fff;font-weight:800;font-size:18px;letter-spacing:.3px;box-shadow:0 3px 8px rgba(11,61,145,.28);text-align:center}
.btn:active{transform:translateY(1px);filter:brightness(1.15)}
.btn.ok{background:var(--ok);box-shadow:0 3px 8px rgba(14,138,74,.3)}
.btn.bad{background:#fff;color:var(--bad);border:2px solid var(--bad);box-shadow:none}
.btn.ghost{background:#fff;color:var(--pri);border:2px solid var(--pri);box-shadow:none}
.btn.warn{background:#ffb300;color:#241700;box-shadow:0 3px 8px rgba(230,145,0,.35)}
.btn.sm{min-height:48px;font-size:16px;border-radius:14px}
.btn[disabled]{background:#c4cedc;color:#fff;box-shadow:none;border-color:transparent}
.btn.ghost[disabled],.btn.bad[disabled]{background:#f0f3f8;color:#9aa8bc;border-color:#d4dce8}
.card{background:var(--surf);border-radius:18px;padding:14px 16px;box-shadow:var(--sh);margin-bottom:12px}
.card>.lb{font-size:13px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;width:100%;text-align:left;background:var(--surf);border-radius:18px;padding:14px 16px;box-shadow:var(--sh);margin-bottom:12px}
.item:active{filter:brightness(.96)}
.item b{font-size:19px}.item .m{color:var(--mut);font-size:15px}.item .go{grid-row:1/3;grid-column:2;color:#9aa8bc}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;letter-spacing:.4px;padding:4px 10px;border-radius:99px;background:#e4eaf3;color:#43546d;white-space:nowrap}
.chip.ok{background:#d6f3e3;color:#0a6a38}.chip.warn{background:#fff0c9;color:#8a5a00}.chip.bad{background:#fbdcdc;color:#9b1c1c}
input,textarea{font:inherit;width:100%;min-height:58px;background:#f6f9fd;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;outline:none}
input:focus,textarea:focus{border-color:var(--pri2);background:#fff}
textarea{min-height:100px;font-weight:500}
.fl{display:block;font-weight:700;color:var(--mut);margin:12px 0 6px;font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mut{color:var(--mut);font-size:15px}
.ob{font-size:14px;color:var(--mut);text-align:center;margin:8px 4px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:82px;border-radius:16px;background:var(--surf);box-shadow:var(--sh);font-weight:800;font-size:15px;color:var(--pri);text-align:center}
.tile .ic{width:28px;height:28px}.tile:active{filter:brightness(.95)}.tile.bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.gps{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:#fff4d6;border:2px solid #ffc83d;margin-bottom:10px}
.gps.ok{background:#dcf5e8;border-color:#37c27c}.gps.bad{background:#fde0e0;border-color:#ef7b7b}
.gps .acc{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}.gps .acc small{font-size:15px;margin-left:2px}
.gps .gt{font-size:14.5px;line-height:1.3}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:12px;box-shadow:var(--sh)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.seg.s3{grid-template-columns:1fr 1fr 1fr}.seg button.inst{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:76px;padding:8px 4px}.seg button.inst b{font-size:24px;font-weight:900}.seg button.inst small{font-size:12px;font-weight:700;opacity:.85}
.seg button{min-height:56px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;color:var(--mut)}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:26px;font-variant-numeric:tabular-nums;color:var(--pri)}.stats span{font-size:12.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
#toast{position:fixed;left:14px;right:14px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:9;display:none;padding:14px 16px;border-radius:14px;background:#0f1c2e;color:#fff;font-weight:700;text-align:center;border-left:6px solid #35d07f;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:612px;margin:0 auto}
/* schermata N20 */
.n20pg{padding:0;overflow:hidden;display:flex;flex-direction:column}
.mon{flex:1;min-height:0;display:grid;grid-template-columns:36% 64%;gap:0;background:var(--surf);margin:12px 12px 0;border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.tbl{overflow-y:auto;border-right:1px solid var(--line);-webkit-overflow-scrolling:touch;position:relative}
.tbl .th{position:sticky;top:0;display:flex;justify-content:space-between;padding:9px 12px;background:var(--pri);color:#fff;font-weight:800;font-size:14px;z-index:1}
.tbl .tr{display:flex;justify-content:space-between;align-items:center;padding:0 12px;height:38px;width:100%;font-variant-numeric:tabular-nums;font-size:17px;border-bottom:1px solid #eef2f7}
.tbl .tr:nth-child(even){background:#f3f6fb}.tbl .tr.last{background:#fff1cc}.tbl .tr b{font-size:19px}
.tbl .empty{padding:18px 12px;color:var(--mut);font-size:15px}
.chart{position:relative;min-height:0;min-width:0}.chart svg{position:absolute;inset:0;width:100%;height:100%}
.inp{flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surf);margin-top:12px;border-radius:22px 22px 0 0;box-shadow:0 -6px 18px rgba(15,28,46,.14)}
.inp .nx{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px;font-size:15px;color:var(--mut);font-weight:700}
.inp .nx b{color:var(--pri);font-size:20px;font-variant-numeric:tabular-nums}
.r1{display:grid;grid-template-columns:1fr 70px;gap:8px;margin-bottom:8px}
.disp{height:58px;border-radius:14px;border:2.5px solid var(--pri2);background:#f6f9fd;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.disp.e{color:#a9b6c9}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
.k{height:52px;border-radius:13px;background:#fff;border:2px solid var(--line);font-size:26px;font-weight:800;color:var(--pri)}
.k:active{background:#dbe7fa}.k.x{color:var(--bad)}
.r4{display:grid;grid-template-columns:70px 1fr;gap:8px}
.r4 .btn{min-height:62px}
.r4 .un{border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--mut);display:flex;align-items:center;justify-content:center}
.r4 .un[disabled]{opacity:.4}
.mini{border-radius:0;background:#000;border:2px solid #4a4a4a;overflow:hidden}
/* tema industriale: nero, ambra, alto contrasto */
:root{--bg:#000;--surf:#0c0c0c;--ink:#fff;--mut:#bdbdbd;--pri:#ffb000;--pri2:#ffb000;--ok:#00e676;--warn:#ffb000;--bad:#ff3b30;--line:#4a4a4a;--sh:none}
html,body,#app{background:#000}
.hd{background:#000;border-radius:0;border-bottom:3px solid var(--pri);box-shadow:none}
.hd h1{text-transform:uppercase;letter-spacing:1px}
.hd .sub{color:var(--pri);opacity:1;text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.hd .sub b{color:#fff}
.hb{border-radius:0;background:#000;border:3px solid #fff}
.hb:active{background:var(--pri);color:#000}
.hb .dot{border-color:#000;background:#777}.hb .dot.on{background:#00e676}
.hb.end{border-radius:0;background:var(--bad);border-color:var(--bad);color:#000;text-transform:uppercase;letter-spacing:2px;font-weight:900}
.logo{border-radius:0;background:#000;border:3px solid var(--pri)}
.btn{border-radius:0;background:var(--pri);color:#000;border:3px solid var(--pri);box-shadow:none;text-transform:uppercase;letter-spacing:2px;font-weight:900}
.btn:active{filter:none;background:#fff;border-color:#fff}
.btn.ok{background:var(--pri);color:#000;box-shadow:none}
.btn.bad{background:#000;color:var(--bad);border:3px solid var(--bad)}
.btn.ghost{background:#000;color:#fff;border:3px solid #fff}
.btn.warn{background:#fff;color:#000;border-color:#fff;box-shadow:none}
.btn[disabled]{background:#1c1c1c;color:#707070;border-color:#333}
.btn.ghost[disabled],.btn.bad[disabled]{background:#000;color:#555;border-color:#333}
.dock{background:#000;border-top:3px solid var(--pri);box-shadow:none}
.card,.item{border-radius:0;background:var(--surf);border:2px solid #4a4a4a;box-shadow:none}
.item:active{filter:none;border-color:var(--pri)}
.card>.lb{color:var(--pri)}
.item .go{color:var(--pri)}
.chip{border-radius:0;background:#000;color:#fff;border:2px solid #777;text-transform:uppercase}
.chip.ok{background:#000;color:#00e676;border-color:#00e676}.chip.warn{background:#000;color:var(--pri);border-color:var(--pri)}.chip.bad{background:#000;color:var(--bad);border-color:var(--bad)}
input,textarea{border-radius:0;background:#000;color:#fff;border:3px solid #fff}
input:focus,textarea:focus{border-color:var(--pri);background:#000}
.tile{border-radius:0;background:#000;border:3px solid #fff;color:#fff;box-shadow:none;text-transform:uppercase}
.tile:active{filter:none;background:var(--pri);color:#000}.tile.bad{color:var(--bad);border-color:var(--bad)}
.gps{border-radius:0;background:#1a1300;border:3px solid var(--pri)}
.gps.ok{background:#001a0c;border-color:#00e676}.gps.bad{background:#1f0805;border-color:var(--bad)}
.thumbs img{border-radius:0;box-shadow:none;border:2px solid #fff}
.seg button{border-radius:0;background:#000;border:3px solid #fff;color:#fff}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#000}
.stats b{color:var(--pri)}
#toast{background:#000;color:#fff;border:3px solid var(--pri);border-radius:0;box-shadow:none;bottom:auto;top:calc(76px + env(safe-area-inset-top))}
/* schermata N20: grafico a sinistra, tastierino a due colonne a destra */
.n20pg{display:grid;grid-template-columns:42% 58%;grid-template-rows:minmax(0,1fr);padding:0;overflow:hidden}
.mon{display:block;margin:0;border-radius:0;box-shadow:none;background:#000;border-right:3px solid var(--pri);min-height:0;position:relative}
.mon .chart{position:absolute;inset:0}
.hd .sub{letter-spacing:.5px;font-size:13px}.hd .sub b{font-size:17px}
.inp{display:flex;flex-direction:column;gap:8px;min-height:0;margin:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#000;border-radius:0;box-shadow:none}
.inp .nx{display:block;margin:0;font-size:12px;color:var(--pri);text-transform:uppercase;letter-spacing:1.5px;line-height:1.3}
.inp .nx span,.inp .nx b{display:block}
.inp .nx b{color:#fff;font-size:17px}
.disp{flex:none;height:76px;border-radius:0;border:3px solid var(--pri);background:#000;font-size:48px;font-weight:900;color:#fff}
.disp.e{color:#666;font-size:34px}
.keys{flex:1;min-height:0;margin:0;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,minmax(0,1fr));grid-auto-flow:column}
.k{height:auto;border-radius:0;background:#111;border:3px solid #fff;color:#fff;font-size:42px;font-weight:900}
.k:active{background:var(--pri);color:#000;border-color:var(--pri)}
.k.x{color:var(--bad);border-color:var(--bad);display:flex;align-items:center;justify-content:center}
.k.x:active{background:var(--bad);color:#000}
.r4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.r4 .un{height:56px;border-radius:0;border:3px solid #fff;background:#000;color:#fff}
.r4 .un[disabled]{opacity:.35}
.r4 .k.x{height:56px}
.r4 .reg{grid-column:1/3;min-height:76px;font-size:22px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
'use strict';
const LS = 'dpshfield.v1';
const FMT = 'dpsh-field-v1';
const STEP = 0.2; // passo predefinito (DPSH, N20); ogni prova ha il proprio passo (t.stepM): 0,10 m per i penetrometri leggeri (N10)
const stp = (t) => (t && t.stepM > 0 ? t.stepM : STEP);
// strumenti ammessi: il passo di conteggio dipende dallo strumento (i nomi devono coincidere con il catalogo del desktop)
const INST = {
  DPSH: { name: 'DPSH73-63MG', step: 0.2, sub: 'N20 · ogni 20 cm' },
  DPM: { name: 'DPM 3020 PAGANI', step: 0.1, sub: 'N10 · 30 kg · h 20 cm' },
};
const nLab = (t) => 'N' + Math.round(stp(t) * 100);
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = (n) => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const fdate = (v) => String(v || '').replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$3/$2/$1');
const f1 = (v, k) => Number(v).toFixed(k == null ? 2 : k).replace('.', ',');
const r2 = (v) => Math.round(v * 100) / 100;

// ---------------------------------------------------------------- icone
const IC = {
  back: 'M15 18l-6-6 6-6', next: 'M9 18l6-6-6-6', cloud: 'M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z', plus: 'M12 5v14M5 12h14',
  camera: 'M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2zM12 9a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',
  check: 'M20 6L9 17l-5-5', x: 'M18 6L6 18M6 6l12 12', undo: 'M1 4v6h6M3.51 15a9 9 0 1 0 2.13-9.36L1 10', stop: 'M7 7h10v10H7z',
  img: 'M21 19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2zM8.5 8.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM21 15l-5-5L5 21',
  dl: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3', edit: 'M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z',
  trash: 'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6', sync: 'M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15',
  pin: 'M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0zM12 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6z', play: 'M6 4l14 8-14 8z',
  bs: 'M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM18 9l-6 6M12 9l6 6',
};
const ic = (n) => '<svg class="ic" viewBox="0 0 24 24"><path d="' + IC[n] + '"/></svg>';

// ---------------------------------------------------------------- archivio locale
let DB = (() => { try { const j = JSON.parse(localStorage.getItem(LS)); if (j && Array.isArray(j.projects)) return j; } catch (e) { /* nuovo */ } return { projects: [], cloud: { url: '', key: '', email: '', session: null } }; })();
DB.cloud = DB.cloud || { url: '', key: '', email: '', session: null };
const save = () => { try { localStorage.setItem(LS, JSON.stringify(DB)); } catch (e) { toast('Memoria piena: sincronizza e libera spazio', 1); } };
const proj = (id) => DB.projects.find((p) => p.id === id);
const liveTests = (p) => p.tests.filter((t) => !t.deleted);
const touch = (p, t) => { if (t) t.rev = (t.rev || 0) + 1; p.dirty = true; save(); };

// foto in IndexedDB (i blob non entrano nel JSON né nel cloud)
const idb = (() => {
  let db;
  const open = () => db ? Promise.resolve(db) : new Promise((res, rej) => { const q = indexedDB.open('dpshfield', 1); q.onupgradeneeded = () => q.result.createObjectStore('photos', { keyPath: 'id' }); q.onsuccess = () => res((db = q.result)); q.onerror = () => rej(q.error); });
  const tx = (mode, fn) => open().then((d) => new Promise((res, rej) => { const t = d.transaction('photos', mode); const r = fn(t.objectStore('photos')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }));
  return { put: (id, blob) => tx('readwrite', (s) => s.put({ id, blob })), get: (id) => tx('readonly', (s) => s.get(id)).then((r) => r && r.blob), del: (id) => tx('readwrite', (s) => s.delete(id)) };
})();

let tt;
function toast(m, bad) { const e = $('#toast'); e.textContent = m; e.style.borderLeftColor = bad ? '#ff6b6b' : '#35d07f'; e.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => (e.style.display = 'none'), 3200); }
const buzz = () => navigator.vibrate && navigator.vibrate(25);

// ---------------------------------------------------------------- stato di navigazione
let V = { v: 'home' };
let draft = null; // nuova prova in compilazione
let buf = ''; // cifre digitate per la lettura corrente
let watchId = null;
let wake = null;
const go = (v) => { V = v; render(); const g = $('.pg'); if (g && v.v !== 'n20') g.scrollTop = 0; };
const keepAwake = async () => { try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => (wake = null)); } } catch (e) { /* non supportato */ } };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && V.v === 'n20') keepAwake(); });

// ---------------------------------------------------------------- GPS
function gpsEstimate(fixes) {
  const best = Math.min(...fixes.map((f) => f.acc));
  const use = fixes.filter((f) => f.acc <= Math.max(best * 1.5, best + 3));
  let sw = 0, la = 0, lo = 0, se = 0, el = 0;

  if (!r.ok) { c.session = null; save(); throw new Error('Sessione scaduta: accedi di nuovo (☁)'); }

}

async function signIn(email, pw) {

  p.tests = p.tests.filter((t) => t.deleted || !dead.has(t.uid));
  p.tests.forEach((t) => dead.has(t.uid) && (t.deleted = true));

// Barre orizzontali (profondità verso il basso). live = schermata di acquisizione: orizzonte minimo 3 m e riga della prossima lettura.
function drawChart(t, el, live) {
  const W = el.clientWidth, H = el.clientHeight;
  if (!W || !H) return;
  const D = t.data, last = D.length ? D[D.length - 1].z : 0;
  const nmax = D.reduce((a, r) => Math.max(a, r.n20), 0);
  const sx = nmax <= 20 ? 5 : nmax <= 50 ? 10 : 20;
  const xmax = Math.max(sx * 2, Math.ceil(nmax / sx) * sx);
  const dmax = live ? Math.max(3, Math.ceil((last + 0.6) * 2) / 2) : Math.max(1, Math.ceil(last * 5) / 5);
  const sy = dmax <= 6 ? 1 : dmax <= 14 ? 2 : 5;
  const L = 40, R = 12, T = 28, B = 6, pw = W - L - R, ph = H - T - B;
  const X = (n) => L + pw * n / xmax, Y = (z) => T + ph * z / dmax;
  let s = '';
  for (let v = 0; v <= xmax + 1e-6; v += sx) s += `<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H - B}" stroke="#333" stroke-dasharray="3 4"/><text x="${X(v)}" y="${T - 10}" text-anchor="middle" font-size="12" font-weight="800" fill="#ffb000">${v}</text>`;
  for (let v = sy; v <= dmax + 1e-6; v += sy) s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#333" stroke-dasharray="3 4"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="12" font-weight="800" fill="#ffb000">${v} m</text>`;
  s += `<line x1="${L}" x2="${L}" y1="${T}" y2="${H - B}" stroke="#ffb000" stroke-width="2"/>`;
  let pz = 0;
  D.forEach((r, i) => {
    const y1 = Y(pz), h = Math.max(1, Y(r.z) - y1 - (Y(r.z) - y1 > 4 ? 1.2 : 0.4)), w = Math.max(1.5, X(r.n20) - L), isLast = i === D.length - 1;
    s += `<rect x="${L}" y="${y1 + 0.5}" width="${w}" height="${h}" rx="${h > 7 ? 2.5 : 0}" fill="${isLast ? '#fff' : '#ffb000'}"/>`;
    if (h >= 11) { const fs = Math.min(13, h - 1), inside = w >= 22; s += `<text x="${inside ? L + w - 5 : L + w + 4}" y="${y1 + 0.5 + h / 2 + fs * 0.35}" text-anchor="${inside ? 'end' : 'start'}" font-size="${fs}" font-weight="800" fill="${inside ? '#000' : '#fff'}">${r.n20}</text>`; }
    pz = r.z;
    if (live) s += `<rect data-a="editR" data-i="${i}" x="0" y="${y1}" width="${W}" height="${Math.max(6, Y(r.z) - y1)}" fill="transparent"/>`;
  });
  if (live) {
    s += `<rect x="${L + 1}" y="${Y(last) + 1}" width="${pw - 2}" height="${Math.max(3, Y(last + stp(t)) - Y(last) - 2)}" fill="rgba(255,176,0,.12)" stroke="#ffb000" stroke-width="2.5" stroke-dasharray="5 3"/>`;
    s += `<line x1="${L}" x2="${W - R}" y1="${Y(last)}" y2="${Y(last)}" stroke="#ffb000" stroke-width="2"/>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${s}</svg>`;
}

  return hd(esc(t.code), fdate(t.date) + (t.refusal === 'yes' ? ' · rifiuto' : ''), hb('back', 'back'))
    + `<div class="pg">
  <div class="card"><div class="stats"><div><b>${t.data.length}</b><span>letture</span></div><div><b>${f1(zmax(t), 1)}</b><span>metri</span></div><div><b>${t.data.reduce((a, r) => Math.max(a, r.n20), 0)}</b>  <span>${nLab(t)} max</span></div></div></div>
  <div class="card"><div class="lb">${ic('pin')} Posizione</div>${has ? Number(t.gpsLat).toFixed(6) + ', ' + Number(t.gpsLon).toFixed(6) + (t.gpsAcc !== '' && t.gpsAcc != null ? ' <span class="mut">(±' + f1(t.gpsAcc, 1) + ' m)</span>' : '') : 'senza GPS'}</div>
  <div class="card"><div class="lb">Grafico</div><div class="mini" id="chart"></div></div>
  ${photoCard(t)}</div>
  <div class="dock"><button class="btn warn" data-a="resume">${ic('edit')} MODIFICA / AGGIUNGI ${nLab(t)}</button><button class="btn bad sm" data-a="delT">${ic('trash')} ELIMINA PROVA</button></div>`;
}
function vCloud() {
  const c = cfg();
  return hd('Cloud', 'Supabase · solo dati numerici', hb('back', 'home'))
    + `<div class="pg"><div class="card">
  <label class="fl" style="margin-top:0">URL progetto</label><input id="cu" value="${esc(c.url)}" placeholder="https://xxxx.supabase.co" autocapitalize="off">
  <label class="fl">Chiave anon / publishable</label><input id="ck" value="${esc(c.key)}" autocapitalize="off">
  <label class="fl">Email (obbligatoria)</label><input id="ce" type="email" value="${esc(c.email)}" autocapitalize="off">
  <label class="fl">Password</label><input id="cp" type="password" placeholder="${c.session ? '(accesso attivo)' : ''}"></div>
  <div class="ob">Nel cloud finiscono solo dati numerici e metadati. Le foto restano sul telefono.</div></div>
  <div class="dock"><button class="btn ok" data-a="cloudSave">${ic('check')} SALVA E ACCEDI</button></div>`;
}

function render() {
  const a = $('#app');
  const p = V.pid ? proj(V.pid) : null;
  const t = p && V.tid ? p.tests.find((x) => x.uid === V.tid) : null;
  if (V.v !== 'new') stopGps();
  if (V.v === 'home') a.innerHTML = vHome();
  else if (V.v === 'project' && p) a.innerHTML = vProject(p);
  else if (V.v === 'new' && p && draft) { a.innerHTML = vNew(p); gpsBox(); thumbsBox(draft.photos.map((x) => x.id), '#thumbs', true); miss(); }
  else if (V.v === 'n20' && p && t) { a.innerHTML = vN20(p, t); keepAwake(); drawN20(); }
  else if (V.v === 'end' && p && t) { a.innerHTML = vEnd(p, t); miniChart(t); thumbsBox(t.photos.map((x) => x.id), '#thumbs', 'rmPhT'); }
  else if (V.v === 'test' && p && t) { a.innerHTML = vTest(p, t); thumbsBox(t.photos.map((x) => x.id), '#thumbs', 'rmPhT'); miniChart(t); }
  else if (V.v === 'cloud') a.innerHTML = vCloud();
  else { V = { v: 'home' }; a.innerHTML = vHome(); }
}

// ---------------------------------------------------------------- azioni
const cur = () => { const p = proj(V.pid); return [p, p && p.tests.find((x) => x.uid === V.tid)]; };
function nextCode(p) {
  const nums = liveTests(p).map((t) => { const m = /(\d+)\s*$/.exec(t.code); return m ? +m[1] : 0; });
  return 'DPSH-' + pad2(Math.max(0, ...nums) + 1);
}
const A = {
  home: () => go({ v: 'home' }),
  cloud: () => go({ v: 'cloud' }),
  newP: () => { const n = (prompt('Nome del progetto') || '').trim(); if (!n) return; const p = { id: uid(), title: n, tests: [], dirty: false, syncedAt: '' }; DB.projects.unshift(p); save(); go({ v: 'project', pid: p.id }); },
  openP: (e) => go({ v: 'project', pid: e.dataset.id }),
  renP: () => { const [p] = cur(); const n = (prompt('Nome del progetto', p.title) || '').trim(); if (n) { p.title = n; touch(p); render(); } },
  delP: () => { const [p] = cur(); if (confirm('Eliminare il progetto «' + p.title + '» dal telefono? (Nel cloud resta.)')) { p.tests.forEach((t) => t.photos && t.photos.forEach((x) => idb.del(x.id))); DB.projects = DB.projects.filter((x) => x !== p); save(); go({ v: 'home' }); } },
  pull: () => { toast('Scarico dal cloud…'); pullAll(); },
  sync: () => { const [p] = cur(); toast('Sincronizzazione…'); syncProject(p); },
  newT: () => { const [p] = cur(); const l = DB.last || {}; const kind = INST[l.kind] ? l.kind : 'DPSH'; draft = { code: nextCode(p), date: today(), gps: null, fixes: [], photos: [], man: false, kind, stepM: INST[kind].step, instrument: INST[kind].name }; go({ v: 'new', pid: p.id }); startGps(); },
  stepSel: (e) => { const k = e.dataset.v; if (!INST[k]) return; draft.kind = k; draft.stepM = INST[k].step; draft.instrument = INST[k].name; render(); },
  cancelNew: () => { if (draft && draft.photos.length && !confirm('Annullare la prova? Le foto scattate verranno scartate.')) return; (draft ? draft.photos : []).forEach((x) => idb.del(x.id)); draft = null; go({ v: 'project', pid: V.pid }); },
  rmPh: (e) => { const i = +e.dataset.i; if (!draft || !draft.photos[i] || !confirm('Rimuovere questa foto?')) return; idb.del(draft.photos[i].id); draft.photos.splice(i, 1); render(); },
  gpsUse: () => { draft.gps = Object.assign(gpsEstimate(draft.fixes), { src: 'telefono' }); stopGps(); gpsBox(); },
  gpsRedo: () => { draft.gps = null; draft.man = false; startGps(); gpsBox(); },
  gpsMan: () => { draft.man = !draft.man; gpsBox(); },
  gpsManOk: () => { const la = parseFloat($('#mlat').value.replace(',', '.')), lo = parseFloat($('#mlon').value.replace(',', '.')); if (!isFinite(la) || !isFinite(lo) || Math.abs(la) > 90 || Math.abs(lo) > 180) return toast('Coordinate non valide', 1); stopGps(); draft.gps = { lat: la, lon: lo, alt: '', acc: null, n: 0, src: 'manuale' }; draft.man = false; gpsBox(); },
  startT: () => {
    const [p] = cur();
    const t = { uid: uid(), rev: 1, code: draft.code.trim(), date: draft.date, gpsLat: +draft.gps.lat.toFixed(7), gpsLon: +draft.gps.lon.toFixed(7), gpsElev: draft.gps.alt === '' ? '' : +Number(draft.gps.alt).toFixed(1), gpsAcc: draft.gps.acc == null ? '' : +draft.gps.acc.toFixed(1), gpsFixes: draft.gps.n || '', gpsSource: draft.gps.src, stepM: draft.stepM, instrument: draft.instrument, data: [], refusal: '', notes: '', photos: draft.photos, status: 'open', createdAt: new Date().toISOString() };
    DB.last = { kind: draft.kind };
    p.tests.push(t); touch(p); draft = null; buf = '';
    go({ v: 'n20', pid: p.id, tid: t.uid });
  },
  openT: (e) => { const [p] = cur(); const t = p.tests.find((x) => x.uid === e.dataset.id); buf = ''; go({ v: t.status === 'done' ? 'test' : 'n20', pid: p.id, tid: t.uid }); },
  back: () => go({ v: 'project', pid: V.pid }),
  resume: () => { buf = ''; go({ v: 'n20', pid: V.pid, tid: V.tid }); },
  key: (e) => { const k = e.dataset.k; if (k === 'C') buf = ''; else if (k === 'B') buf = buf.slice(0, -1); else if (buf.length < 3) buf += k; const d = $('#disp'); d.textContent = buf === '' ? nLab(cur()[1]) : buf; d.classList.toggle('e', buf === ''); buzz(); },
  reg: () => {
    const [p, t] = cur();
    if (buf === '') return toast('Digita il numero di colpi ' + nLab(t), 1);
    const z = t.data.length ? r2(t.data[t.data.length - 1].z + stp(t)) : t.z0 || stp(t);
    t.data.push({ z, n20: +buf }); buf = ''; touch(p, t); buzz(); render();
  },
  undo: () => { const [p, t] = cur(); if (!t.data.length) return; t.data.pop(); touch(p, t); render(); },
  editR: (e) => { const [p, t] = cur(); const i = +e.dataset.i; const v = prompt(nLab(t) + ' a ' + f1(t.data[i].z) + ' m (vuoto = elimina ultima)', t.data[i].n20); if (v === null) return; if (!/^\d{1,3}$/.test(v.trim())) return v.trim() === '' && i === t.data.length - 1 ? A.undo() : toast('Valore non valido', 1); t.data[i].n20 = +v; touch(p, t); render(); },
  z0: () => { const [p, t] = cur(); const v = parseFloat((prompt('Profondità del primo intervallo (m)', t.z0 || stp(t)) || '').replace(',', '.')); if (isFinite(v) && v > 0 && v < 50) { t.z0 = r2(v); touch(p, t); render(); } },
  endT: () => go({ v: 'end', pid: V.pid, tid: V.tid }),
  ref: (e) => { const [p, t] = cur(); t.notes = ($('#notes') || {}).value || t.notes; t.refusal = t.refusal === e.dataset.v ? '' : e.dataset.v; touch(p, t); render(); },
  finish: () => { const [p, t] = cur(); t.notes = $('#notes').value.trim(); t.status = 'done'; touch(p, t); toast('Prova salvata ✓'); go({ v: 'project', pid: p.id }); syncProject(p, true); },
  delT: () => { const [p, t] = cur(); if (!confirm('Eliminare la prova ' + t.code + '?')) return; (t.photos || []).forEach((x) => idb.del(x.id)); t.deleted = true; t.data = []; t.photos = []; touch(p, t); go({ v: 'project', pid: p.id }); },
  dlJson: () => { const [p] = cur(); download(p.title.replace(/[^\w-]+/g, '_') + '.field.json', JSON.stringify(docOf(p), null, 1), 'application/json'); },
  sharePh: () => { const [p] = cur(); return sharePhotos(p, liveTests(p)); },
  sharePhT: () => { const [p, t] = cur(); return sharePhotos(p, [t]); },
  rmPhT: (e) => {
    const [p, t] = cur(), i = +e.dataset.i;
    if (!t || !t.photos[i]) return;
    if (t.photos.length <= 1) return toast('Ogni prova richiede almeno una foto: aggiungine un’altra prima di rimuovere questa', 1);
    if (!confirm('Rimuovere questa foto?')) return;
    idb.del(t.photos[i].id); t.photos.splice(i, 1); touch(p, t); render(); if (t.status === 'done') syncProject(p, true);
  },
  cloudSave: async () => {
    const c = cfg();
    c.url = $('#cu').value.trim().replace(/\/+$/, ''); c.key = $('#ck').value.trim(); c.email = $('#ce').value.trim();
    const pw = $('#cp').value;
    save();
    try { if (c.email && pw) await signIn(c.email, pw); else if (!c.email) c.session = null; await api('dpsh_projects?select=id&limit=1'); toast('Cloud collegato ✓'); go({ v: 'home' }); } catch (e) { toast(e.message === 'Failed to fetch' ? 'Nessuna rete' : e.message, 1); }
  },
};
function download(name, data, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
async function sharePhotos(p, tests) {
  const files = [];
  for (const t of tests) for (let i = 0; i < t.photos.length; i++) { const b = await idb.get(t.photos[i].id); if (b) files.push(new File([b], photoName(t, i), { type: 'image/jpeg' })); }
  if (!files.length) return toast('Nessuna foto da condividere', 1);
  try { if (navigator.canShare && navigator.canShare({ files })) return await navigator.share({ files, title: p.title }); } catch (e) { if (e.name === 'AbortError') return; }
  files.forEach((f, i) => setTimeout(() => download(f.name, f, 'image/jpeg'), i * 400));
}
document.addEventListener('click', (e) => { const el = e.target.closest('[data-a]'); if (el && A[el.dataset.a]) { e.preventDefault(); A[el.dataset.a](el); } });
document.addEventListener('input', (e) => {
  if (V.v !== 'new' || !draft) return;
  if (e.target.id === 'code') draft.code = e.target.value;
  if (e.target.id === 'date') draft.date = e.target.value;
  miss();
});
document.addEventListener('change', async (e) => {
  if (e.target.id === 'cam2' && (V.v === 'test' || V.v === 'end') && e.target.files[0]) {
    const f = e.target.files[0], [p, t] = cur();
    e.target.value = '';
    try { const blob = await shrink(f), id = uid(); await idb.put(id, blob); t.photos.push({ id }); touch(p, t); toast('Foto aggiunta ✓'); render(); if (t.status === 'done') syncProject(p, true); } catch (err) { toast('Foto non salvata: ' + err.message, 1); }
    return;
  }
  if (e.target.id !== 'cam' || V.v !== 'new' || !e.target.files[0]) return;
  const f = e.target.files[0];
  e.target.value = '';
  try {
    const blob = await shrink(f);
    const id = uid();
    await idb.put(id, blob);
    draft.photos.push({ id });
    render();
  } catch (err) { toast('Foto non salvata: ' + err.message, 1); }
});
function shrink(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('immagine non valida')); };
    im.onload = () => {
      const k = Math.min(1, 1920 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob((b) => (b ? res(b) : rej(new Error('compressione fallita'))), 'image/jpeg', 0.85);
    };
    im.src = u;
  });
}

render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.onLine) DB.projects.filter((p) => p.dirty && cloudOk()).forEach((p) => syncProject(p, true));
</script>
